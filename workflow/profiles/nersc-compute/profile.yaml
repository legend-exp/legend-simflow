# this profile is meant to be used on NERSC compute nodes

configfile: simflow-config.yaml
keep-going: true
rerun-incomplete: true
cores: all
scheduler: greedy

local-storage-prefix: $SCRATCH/legend-simflow/$HOSTNAME

# https://docs.nersc.gov/systems/perlmutter/architecture/
# Slurm grants 487802 MiB per CPU node, leave some room for the system
resources:
  mem_mb: 480000

# 1.5 GB per thread by default, so that all 256 hardware threads can be used
default-resources:
  mem_mb: 1500 * threads

set-resources:
  # measured up to 2.5 GB
  build_tier_opt:
    mem_mb: 2500
  build_tier_evt:
    mem_mb: 2000
  # this SSD.jl processes seems to use a lot of memory, can't run so many in
  # parallel!
  build_hpge_drift_time_map:
    mem_mb: 8000
  build_hpge_pulse_shape_library:
    mem_mb: 8000
  plot_geom_rendering:
    mem_mb: 2500
  plot_geom_hpge_mass:
    mem_mb: 2500
