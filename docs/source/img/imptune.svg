<svg xmlns="http://www.w3.org/2000/svg" id="simflow-imptune" viewBox="0 0 764 470" width="100%" style="display: block; height: auto;" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12">
  <title>Impurity tuning chain</title>
  <style>
    /* colors follow the light/dark theme of the docs (Furo variables) */
    #simflow-imptune { --border: #d1d9e0; --file: #eaeef2; --file-border: #c3cbd3; }
    body[data-theme="dark"] #simflow-imptune { --border: #3d444d; --file: #262b33; --file-border: #4b525b; }
    @media (prefers-color-scheme: dark) {
      body:not([data-theme="light"]) #simflow-imptune { --border: #3d444d; --file: #262b33; --file-border: #4b525b; }
    }
    #simflow-imptune text { fill: var(--color-foreground-primary, #1f2328); }
    #simflow-imptune .muted { fill: var(--color-foreground-secondary, #59636e); }
    #simflow-imptune .b { font-weight: 600; }
    #simflow-imptune .sub { font-size: 10.5px; fill: var(--color-foreground-secondary, #59636e); }
    #simflow-imptune .file { fill: var(--file); stroke: var(--file-border); stroke-width: 1.5; }
    #simflow-imptune .box { fill: var(--color-background-primary, #ffffff); stroke: var(--border); stroke-width: 1.5; }
    #simflow-imptune .grid { fill: none; stroke: var(--color-foreground-secondary, #59636e); stroke-width: 0.9; }
    #simflow-imptune .arrow { fill: none; stroke: var(--color-foreground-secondary, #59636e); stroke-width: 1.25; stroke-linecap: round; stroke-linejoin: round; }
    #simflow-imptune .head { fill: none; stroke: var(--color-foreground-secondary, #59636e); stroke-width: 1.25; stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <!-- inputs -->
  <rect class="file" x="16" y="16" width="232" height="36" rx="8"/>
  <text x="132" y="38" text-anchor="middle" class="b">tuning simulations (stp)</text>
  <rect class="file" x="280" y="16" width="468" height="36" rx="8"/>
  <text x="514" y="38" text-anchor="middle" class="b">LEGEND-200 data production</text>

  <rect class="box" x="40" y="86" width="200" height="40" rx="6"/>
  <text x="140.0" y="103" text-anchor="middle">ideal pulse-shape scan</text>
  <text x="140.0" y="118" text-anchor="middle" class="sub">grid of slope × depletion voltage</text>
  <rect class="box" x="300" y="86" width="160" height="40" rx="6"/>
  <text x="380.0" y="103" text-anchor="middle">data superpulses</text>
  <text x="380.0" y="118" text-anchor="middle" class="sub">from the calibration data</text>
  <rect class="box" x="290" y="166" width="180" height="40" rx="6"/>
  <text x="380.0" y="183" text-anchor="middle">electronics response</text>
  <text x="380.0" y="198" text-anchor="middle" class="sub">fit at every grid point</text>
  <rect class="box" x="40" y="246" width="200" height="40" rx="6"/>
  <text x="140.0" y="263" text-anchor="middle">simulated drift times</text>
  <text x="140.0" y="278" text-anchor="middle" class="sub">at every grid point</text>
  <rect class="box" x="528" y="246" width="200" height="40" rx="6"/>
  <text x="628.0" y="263" text-anchor="middle">data drift times</text>
  <text x="628.0" y="278" text-anchor="middle" class="sub">events of the run</text>
  <rect class="box" x="200" y="326" width="360" height="40" rx="6"/>
  <text x="380.0" y="343" text-anchor="middle">impurity fit</text>
  <text x="380.0" y="358" text-anchor="middle" class="sub">drift-time χ² + waveform χ², grid minimum</text>
  <rect class="file" x="200" y="406" width="360" height="40" rx="6"/>
  <text x="380.0" y="423" text-anchor="middle">tuned impurity profiles</text>
  <text x="380.0" y="438" text-anchor="middle" class="sub">slope and depletion voltage per detector</text>
  <text x="572" y="431" class="muted" font-size="11">read by later productions</text>

  <!-- grid tags: boxes that work on the slope × depletion-voltage grid -->
  <rect class="grid" x="221" y="92" width="12" height="12" rx="1"/><path class="grid" d="M225 92 V104 M221 96 H233"/><path class="grid" d="M229 92 V104 M221 100 H233"/>
  <rect class="grid" x="451" y="172" width="12" height="12" rx="1"/><path class="grid" d="M455 172 V184 M451 176 H463"/><path class="grid" d="M459 172 V184 M451 180 H463"/>
  <rect class="grid" x="221" y="252" width="12" height="12" rx="1"/><path class="grid" d="M225 252 V264 M221 256 H233"/><path class="grid" d="M229 252 V264 M221 260 H233"/>
  <rect class="grid" x="541" y="332" width="12" height="12" rx="1"/><path class="grid" d="M545 332 V344 M541 336 H553"/><path class="grid" d="M549 332 V344 M541 340 H553"/>

  <!-- arrows -->
  <path class="arrow" d="M28 52 V266 H40"/>
  <path class="head" d="M33 262.5 L40 266 L33 269.5"/>
  <path class="arrow" d="M380 52 V86"/>
  <path class="head" d="M376.5 79 L380 86 L383.5 79"/>
  <path class="arrow" d="M628 52 V246"/>
  <path class="head" d="M624.5 239 L628 246 L631.5 239"/>
  <path class="arrow" d="M140 126 V246"/>
  <path class="head" d="M136.5 239 L140 246 L143.5 239"/>
  <path class="arrow" d="M240 106 H265 V186 H290"/>
  <path class="head" d="M283 182.5 L290 186 L283 189.5"/>
  <path class="arrow" d="M380 126 V166"/>
  <path class="head" d="M376.5 159 L380 166 L383.5 159"/>
  <path class="arrow" d="M340 206 V266 H240"/>
  <path class="head" d="M247 262.5 L240 266 L247 269.5"/>
  <text x="346" y="246" class="muted" font-size="11">best fit</text>
  <path class="arrow" d="M420 206 V326"/>
  <path class="head" d="M416.5 319 L420 326 L423.5 319"/>
  <text x="426" y="300" class="muted" font-size="11">fit RMS</text>
  <path class="arrow" d="M140 286 V346 H200"/>
  <path class="head" d="M193 342.5 L200 346 L193 349.5"/>
  <path class="arrow" d="M628 286 V346 H560"/>
  <path class="head" d="M567 342.5 L560 346 L567 349.5"/>
  <path class="arrow" d="M380 366 V406"/>
  <path class="head" d="M376.5 399 L380 406 L383.5 399"/>
</svg>
