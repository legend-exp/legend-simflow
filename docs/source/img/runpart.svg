  <!-- job boundaries -->
  <text x="152" y="94" class="ks muted">job 0</text>
  <line class="job" x1="300" y1="84" x2="300" y2="98"/>
  <text x="304" y="94" class="ks muted">job 1</text>
  <line class="job" x1="450" y1="84" x2="450" y2="98"/>
  <text x="454" y="94" class="ks muted">job 2</text>

  <!-- each slice is processed with the parameters of its run -->
  <path class="arrow" marker-end="url(#simflow-runpart-head)" d="M217.5 140 V162"/>
  <path class="arrow" marker-end="url(#simflow-runpart-head)" d="M397.5 140 V162"/>
  <path class="arrow" marker-end="url(#simflow-runpart-head)" d="M555 140 V162"/>
  <rect class="r0" x="162.5" y="166" width="110" height="24" rx="5"/>
  <text x="217.5" y="182" text-anchor="middle" class="ks">r001 parameters</text>
  <rect class="r1" x="342.5" y="166" width="110" height="24" rx="5"/>
  <text x="397.5" y="182" text-anchor="middle" class="ks">r002 parameters</text>
  <rect class="r2" x="500" y="166" width="110" height="24" rx="5"/>
  <text x="555" y="182" text-anchor="middle" class="ks">r003 parameters</text>
  <text x="140" y="182" text-anchor="end">processed with</text>
